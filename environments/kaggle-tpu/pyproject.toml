[project]
name = "vdt-kaggle-tpu-environment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-tunix @ git+https://github.com/sontungkieu/tunix.git@50f5752a17edec56e2aa30aabfc03859949adf6f",
    "flax>=0.12.5,<0.13",
    "google-metrax>=0.2.3,<0.3",
    "grain",
    "huggingface-hub>=0.34,<1.0",
    "jaxtyping",
    "orbax-checkpoint>=0.12,<0.13",
    "qwix>=0.1.6",
    "safetensors>=0.6,<0.8",
    "sentencepiece>=0.2,<0.3",
    "transformers>=4.55,<5,!=4.57.2",
    "wandb>=0.19,<0.20",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]
